<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF5722"/>
      <stop offset="50%" stop-color="#EE4D2D"/>
      <stop offset="100%" stop-color="#D83A16"/>
    </linearGradient>

    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="100%" stop-color="#FFF8F5"/>
    </linearGradient>

    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE082"/>
      <stop offset="50%" stop-color="#FFD54F"/>
      <stop offset="100%" stop-color="#FFB300"/>
    </linearGradient>

    <linearGradient id="shopeeOrange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF6B4A"/>
      <stop offset="100%" stop-color="#EE4D2D"/>
    </linearGradient>

    <!-- Filters for 3D glow & shadow -->
    <filter id="dropShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="16" stdDeviation="24" flood-color="#000000" flood-opacity="0.25"/>
    </filter>

    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background -->
  <rect width="1200" height="630" fill="url(#bgGrad)"/>

  <!-- Decorative circles -->
  <circle cx="1100" cy="80" r="260" fill="#FFFFFF" fill-opacity="0.08"/>
  <circle cx="100" cy="550" r="300" fill="#000000" fill-opacity="0.06"/>
  <circle cx="950" cy="500" r="180" fill="#FFFFFF" fill-opacity="0.05"/>

  <!-- Main White Card Container -->
  <rect x="40" y="40" width="1120" height="550" rx="36" fill="url(#cardGrad)" filter="url(#dropShadow)"/>

  <!-- LEFT COLUMN: TEXT CONTENT -->
  <!-- Top Badge -->
  <g transform="translate(80, 85)">
    <rect width="360" height="42" rx="21" fill="#FFF0EB" stroke="#FFC4B2" stroke-width="2"/>
    <text x="35" y="27" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#EE4D2D">
      🔥 SIÊU HOÀN TIỀN SHOPEE SỐ 1 VN
    </text>
  </g>

  <!-- Main Title -->
  <text x="80" y="195" font-family="Arial, Helvetica, sans-serif" font-size="52" font-weight="900" fill="#1E293B">
    MUA SẮM THÔNG MINH
  </text>

  <!-- Highlight Badge 60% -->
  <g transform="translate(80, 220)">
    <rect width="520" height="64" rx="16" fill="#EE4D2D"/>
    <text x="24" y="45" font-family="Arial, Helvetica, sans-serif" font-size="34" font-weight="900" fill="#FFFFFF">
      NHẬN LẠI 60% TIỀN HOA HỒNG
    </text>
  </g>

  <!-- Subtitle -->
  <text x="80" y="330" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#64748B">
    Dán link sản phẩm Shopee bất kỳ • Nhận tiền mặt về ví
  </text>
  <text x="80" y="365" font-family="Arial, Helvetica, sans-serif" font-size="20" font-weight="bold" fill="#64748B">
    Rút tiền 24/7 về thẻ ngân hàng &amp; MoMo từ 50.000 VNĐ!
  </text>

  <!-- Value Badges -->
  <g transform="translate(80, 420)">
    <rect width="160" height="46" rx="12" fill="#F1F5F9"/>
    <text x="20" y="29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#334155">
      ✅ Uy Tín 100%
    </text>
  </g>

  <g transform="translate(255, 420)">
    <rect width="180" height="46" rx="12" fill="#ECFDF5" stroke="#A7F3D0" stroke-width="1.5"/>
    <text x="18" y="29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#059669">
      💰 Hoàn Tiền Mặt
    </text>
  </g>

  <g transform="translate(450, 420)">
    <rect width="180" height="46" rx="12" fill="#EFF6FF" stroke="#BFDBFE" stroke-width="1.5"/>
    <text x="20" y="29" font-family="Arial, Helvetica, sans-serif" font-size="16" font-weight="bold" fill="#2563EB">
      ⚡ Rút VietQR 24/7
    </text>
  </g>

  <!-- RIGHT COLUMN: SHOPPING BAG + CASH FLOWING TO WALLET + GIRL ILLUSTRATION -->
  <g transform="translate(730, 90)">
    
    <!-- Large Shopee Shopping Bag -->
    <g transform="translate(80, 60)">
      <!-- Bag Handle -->
      <path d="M 60 50 Q 120 -30 180 50" stroke="#EE4D2D" stroke-width="16" fill="none" stroke-linecap="round"/>
      <!-- Bag Body -->
      <rect x="20" y="50" width="200" height="230" rx="28" fill="url(#shopeeOrange)" filter="url(#dropShadow)"/>
      <!-- Shopee White S Logo in Bag -->
      <circle cx="120" cy="155" r="45" fill="#FFFFFF"/>
      <path d="M 105 155 C 105 142, 135 142, 135 130 C 135 120, 110 120, 105 132" stroke="#EE4D2D" stroke-width="9" fill="none" stroke-linecap="round"/>
      <path d="M 135 155 C 135 168, 105 168, 105 180 C 105 190, 130 190, 135 178" stroke="#EE4D2D" stroke-width="9" fill="none" stroke-linecap="round"/>
    </g>

    <!-- Cash Wallet / Pocket (Tiền chảy vào túi) -->
    <g transform="translate(0, 240)">
      <rect width="170" height="130" rx="20" fill="#1E293B" filter="url(#dropShadow)"/>
      <rect x="10" y="20" width="150" height="100" rx="14" fill="#334155"/>
      <circle cx="85" cy="70" r="18" fill="url(#goldGrad)"/>
      <text x="79" y="77" font-family="Arial" font-size="20" font-weight="900" fill="#78350F">₫</text>
      <!-- Cash bills sticking out -->
      <rect x="25" y="-15" width="120" height="35" rx="6" fill="#10B981" transform="rotate(-6 25 -15)"/>
      <text x="45" y="8" font-family="Arial" font-size="14" font-weight="bold" fill="#FFFFFF">500.000 đ</text>
    </g>

    <!-- Flying Gold Coins Stream from Shopee Bag into Wallet -->
    <!-- Coin 1 -->
    <g transform="translate(190, 180) rotate(-15)">
      <circle cx="0" cy="0" r="26" fill="url(#goldGrad)" stroke="#F59E0B" stroke-width="3" filter="url(#glow)"/>
      <text x="-9" y="8" font-family="Arial" font-size="24" font-weight="bold" fill="#78350F">₫</text>
    </g>

    <!-- Coin 2 -->
    <g transform="translate(130, 230) rotate(12)">
      <circle cx="0" cy="0" r="32" fill="url(#goldGrad)" stroke="#F59E0B" stroke-width="4" filter="url(#glow)"/>
      <text x="-11" y="10" font-family="Arial" font-size="30" font-weight="bold" fill="#78350F">₫</text>
    </g>

    <!-- Coin 3 -->
    <g transform="translate(70, 210) rotate(-25)">
      <circle cx="0" cy="0" r="22" fill="url(#goldGrad)" stroke="#F59E0B" stroke-width="3"/>
      <text x="-8" y="7" font-family="Arial" font-size="20" font-weight="bold" fill="#78350F">₫</text>
    </g>

    <!-- Coin 4 -->
    <g transform="translate(260, 280) rotate(30)">
      <circle cx="0" cy="0" r="20" fill="url(#goldGrad)" stroke="#F59E0B" stroke-width="2.5"/>
      <text x="-7" y="6" font-family="Arial" font-size="18" font-weight="bold" fill="#78350F">₫</text>
    </g>

    <!-- Floating 60% Cashback Star Badge -->
    <g transform="translate(240, 70)">
      <circle cx="45" cy="45" r="45" fill="#FEF08A" stroke="#F59E0B" stroke-width="4" filter="url(#glow)"/>
      <text x="18" y="42" font-family="Arial, Helvetica, sans-serif" font-size="22" font-weight="900" fill="#B45309">HOÀN</text>
      <text x="18" y="66" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="900" fill="#DC2626">60%</text>
    </g>

  </g>
</svg>
